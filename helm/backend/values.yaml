namespace: app

replicaCount: 3

image:
  repository: tunang227/notes-backend
  tag: 1.2.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

nodeSelector:
  workload: backend

toleration:
  key: dedicated
  operator: Equal
  value: backend
  effect: NoSchedule

resources:
  requests:
    cpu: "250m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"

startupProbe:
  path: /api/healthz
  port: 3000
  periodSeconds: 2
  failureThreshold: 15

livenessProbe:
  path: /api/healthz
  port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  path: /api/readyz
  port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 30

# Name of the secret created by the database chart
secretName: postgres-secret
