apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
spec:
  provider:
    vault:
      server: "http://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "notes-app"

          serviceAccountRef:
            name: external-secrets-vault
            audiences:
              - vault