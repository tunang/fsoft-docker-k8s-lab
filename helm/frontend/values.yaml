namespace:
  app: app
  edge: edge

replicaCount: 2

image:
  repository: tunang227/notes-frontend
  tag: latest
  pullPolicy: Always

containerPort: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 80

edgeService:
  type: ExternalName
  externalName: frontend.app.svc.cluster.local

nodeSelector:
  workload: frontend

toleration:
  key: dedicated
  operator: Equal
  value: frontend
  effect: NoSchedule

resources:
  requests:
    cpu: "250m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"

livenessProbe:
  path: /healthz
  port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  path: /readyz
  port: 80
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
