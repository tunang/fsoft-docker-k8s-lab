# ============================================================
# Argo CD Helm configuration
# Environment: local Minikube
# Namespace: gitops
# ============================================================

# ------------------------------------------------------------
# Argo CD configuration
# ------------------------------------------------------------

configs:
  cm:
    # Keep local admin account enabled
    admin.enabled: true

    # How frequently Argo CD checks Git for changes
    timeout.reconciliation: 120s

  secret:
    createSecret: true

    # Leave empty.
    # Argo CD will generate an initial admin password.
    argocdServerAdminPassword: ""

    argocdServerAdminPasswordMtime: ""


# ------------------------------------------------------------
# Application Controller
# ------------------------------------------------------------

controller:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# API Server / Web UI
# ------------------------------------------------------------

server:
  replicas: 1

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi


# ------------------------------------------------------------
# Repository Server
# Pulls Git repositories and renders Helm/Kustomize manifests
# ------------------------------------------------------------

repoServer:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi


# ------------------------------------------------------------
# ApplicationSet
# ------------------------------------------------------------

applicationSet:
  replicas: 1


# ------------------------------------------------------------
# Redis
# Required by Argo CD
# ------------------------------------------------------------

redis:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# Dex
#
# Used for SSO/OIDC.
# Not required for your current local setup.
# ------------------------------------------------------------

dex:
  enabled: false


# ------------------------------------------------------------
# Notifications
#
# Disable for now to save resources.
# You can enable this later for Slack/email/etc.
# ------------------------------------------------------------

notifications:
  enabled: false